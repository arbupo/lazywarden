services:
  lazywarden:
    container_name: lazywarden
    hostname: lazywarden
    image: querylab/lazywarden:latest
    env_file:
      - ~/selfhosted/lazywarden/.env
    environment:
      UNLOCK_VAULT: "true"
    volumes:
      - ~/selfhosted/lazywarden/config:/root/lazywarden/config
      - ~/selfhosted/lazywarden/backup-drive:/root/lazywarden/backup-drive/
      - ~/selfhosted/lazywarden/.env:/app/.env
    restart: unless-stopped
